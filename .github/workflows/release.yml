name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  # Build each platform natively (required because go-tree-sitter uses CGo).
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: assay-linux-amd64
            binary: assay
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: assay-darwin-amd64
            binary: assay
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: assay-darwin-arm64
            binary: assay
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: assay-windows-amd64.exe
            binary: assay.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GCC (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build binary
        run: >
          go build
          -ldflags="-s -w -X main.Version=${{ github.ref_name }}"
          -o dist/${{ matrix.binary }}
          ./cmd/assay
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Smoke test (non-Windows)
        if: runner.os != 'Windows'
        run: dist/${{ matrix.binary }} --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: dist\${{ matrix.binary }} --version
        shell: cmd

      - name: Rename artifact
        run: cp dist/${{ matrix.binary }} ${{ matrix.artifact }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Collect all platform artifacts and publish a GitHub Release.
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts into release/
        run: |
          mkdir -p release/
          find artifacts/ -type f -exec cp {} release/ \;

      - name: Generate SHA-256 checksums
        run: |
          cd release/
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: release/SHA256SUMS.txt

  # Update the Homebrew tap formula with the new version and source SHA-256.
  homebrew:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Compute source tarball SHA-256
        id: sha
        run: |
          TAG="${{ github.ref_name }}"
          SHA=$(curl -sL "https://github.com/orieken/assay/archive/refs/tags/${TAG}.tar.gz" | shasum -a 256 | awk '{print $1}')
          echo "src=${SHA}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "ver=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Clone homebrew tap
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/orieken/homebrew-tap.git tap
          mkdir -p tap/Formula

      - name: Write formula
        env:
          VER: ${{ steps.sha.outputs.ver }}
          SHA: ${{ steps.sha.outputs.src }}
        run: |
          python3 - <<'PY'
          import os, textwrap
          ver = os.environ["VER"]
          sha = os.environ["SHA"]
          formula = textwrap.dedent(f"""\
            class Assay < Formula
              desc "Language-agnostic test scaffold generator"
              homepage "https://github.com/orieken/assay"
              url "https://github.com/orieken/assay/archive/refs/tags/v{ver}.tar.gz"
              sha256 "{sha}"
              license "MIT"
              head "https://github.com/orieken/assay.git", branch: "main"

              depends_on "go" => :build

              def install
                ldflags = %W[
                  -s -w
                  -X github.com/orieken/assay/cmd/assay.Version=#{{version}}
                ]
                system "go", "build", *std_go_args(ldflags: ldflags.join(" ")), "./cmd/assay"
              end

              test do
                assert_match version.to_s, shell_output("#{{bin}}/assay version")
              end
            end
          """)
          with open("tap/Formula/assay.rb", "w") as f:
              f.write(formula)
          print("wrote Formula/assay.rb")
          PY

      - name: Commit and push
        run: |
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/assay.rb
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(assay): update formula to ${{ github.ref_name }}"
          git push
