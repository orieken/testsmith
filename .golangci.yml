linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - nilerr
    - exhaustive

linters-settings:
  goimports:
    local-prefixes: github.com/orieken/testsmith
  exhaustive:
    default-signifies-exhaustive: true

issues:
  exclude-rules:
    # Test files can use t.Fatal, fmt.Println, etc. freely.
    - path: "_test\\.go"
      linters: [errcheck, unparam]
    # CLI main entry points intentionally ignore some errors.
    - path: "cmd/testsmith/main\\.go"
      linters: [errcheck]

  max-issues-per-linter: 0
  max-same-issues: 0
